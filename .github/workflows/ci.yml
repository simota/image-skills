name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml
      - name: Static rules
        run: python3 image-tools/validate.py
      - name: Every rule still fires
        run: python3 image-tools/test_validate.py
      - name: The figures still recompute
        run: python3 image-tools/figures_check.py
      - name: Every figure check still fires
        run: python3 image-tools/test_figures.py
      - name: The tools read what is there
        run: python3 image-tools/test_tools.py
      - name: Delivered blocks are current
        run: |
          python3 image-tools/render.py
          git diff --exit-code || {
            echo "SKILL.md delivery blocks are stale — run: make render"; exit 1; }
