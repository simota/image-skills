# A record of misroutes.
#
# This does not reproduce how a model chooses. It is a proxy for finding
# missing and duplicated signals, and "fixtures pass" does not mean "nothing
# will be misrouted".

- ask: "we need a hero picture and nobody has decided the art style"
  expect: image-generate
- ask: "write the image brief before anyone generates anything"
  expect: image-generate
- ask: "write the generation prompt for the banner"
  expect: image-generate
- ask: "run the generation and give me something to look at"
  expect: image-generate
- ask: "edit a region, the hand is broken"
  expect: image-generate
- ask: "upscale it for the print version"
  expect: image-generate
- ask: "what file format should this ship as"
  expect: image-generate
- ask: "generate the srcset sizes and put the file where it lands"
  expect: image-generate
- ask: "is this usable or not"
  expect: image-review
- ask: "check it for artefacts before we ship it"
  expect: image-review
- ask: "the text in the image is garbled, give me a ranked verdict"
  expect: image-review
# A control request must reach its constraints, not imply the control exists.
- ask: "reuse the same seed"
  expect: image-generate
- ask: "seed 1234で作って"
  expect: image-generate
# Neighbours that must keep winning. Making and judging share their nouns, so
# the boundary is pinned from the judging side: the longer signal is the verdict.
- ask: "check the upscale for artefacts"
  expect: image-review
- ask: "is this file format usable or not"
  expect: image-review
