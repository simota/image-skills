# Chains that recur, as control structure rather than prose.
#
# A chain of names expresses linear work only. Where a stage repeats until a
# condition holds, the condition, the judge, and the hard stop are required —
# without them "until it looks right" has no stopping rule.

illustrate:
  pattern: linear
  when: "a picture is needed and nothing about it is decided yet"
  chain: [image-direction, image-prompt, image-generate, image-review, image-deliver]
  gate: "the brief names what the image is judged against before any prompt is written"

one-off:
  pattern: linear
  when: "the look is settled; only an exploratory candidate is wanted, not an asset ready to use"
  chain: [image-prompt, image-generate]
  gate: "the look or brief is named; report a candidate, never a production usability verdict"

one-off-ship:
  pattern: linear
  when: "the look is settled and one image is needed for use or publication"
  chain: [image-prompt, image-generate, image-review, image-deliver]
  gate: "review the actual candidate for its intended use before delivery; text, people and brand constraints follow that use"

asset-set:
  pattern: linear
  when: "a family of images that must read as one set"
  chain: [image-direction, image-prompt, image-generate, image-review, image-deliver]
  gate: "name the set constraints first; review every retained member and the set together before delivery"

repair:
  pattern: linear
  when: "a picture that exists is wrong in a way someone can point at"
  chain: [image-review, image-refine, image-review]
  gate: "locate findings before changing; the final review checks their removal and any new drift"

restyle:
  pattern: linear
  when: "the content is right and the look is not"
  chain: [image-direction, image-refine, image-review]

ship-existing:
  pattern: linear
  when: "the picture is already approved for the intended use and only delivery remains"
  chain: [image-deliver]

look-check:
  pattern: report-only
  when: "is this image usable, and what is wrong with it"
  chain: [image-review]
  stops_at: "one verdict with each defect located, ranked, and attributed to a cause. Nothing is regenerated"

refine-to-brief:
  pattern: loop
  when: "iterate a candidate until it meets the brief or the budget stops it"
  chain: [image-refine, image-review]
  oracle: "no open defect at severity major or above, and one full pass over the image adds none"
  checker: other-engine       # resolved at run time to one that is not running this
  max_cycles: 4               # hard bound, not a target; stop sooner on success or budget
  gate: "inherit all generation/edit attempts and spend; a new defect does not reset this loop or its budget"
